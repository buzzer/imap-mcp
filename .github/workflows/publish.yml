name: publish

# Builds the container image and publishes the entry in the MCP registry.
# Runs for version tags; the tag must match the version in server.json.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/buzzer/imap-mcp
  MCP_PUBLISHER_VERSION: v1.8.8
  MCP_PUBLISHER_SHA256: 09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the image to ghcr.io
      id-token: write   # OIDC login at the MCP registry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check that tag and server.json agree
        id: version
        run: |
          version="$(jq -r .version server.json)"
          identifier="$(jq -r '.packages[0].identifier' server.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match server.json version ${version}"
            exit 1
          fi
          if [ "${identifier}" != "${IMAGE}:${version}" ]; then
            echo "::error::Package identifier ${identifier} is not ${IMAGE}:${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Run offline tests
        run: python3 -m unittest discover -s tests

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the image (amd64, arm64)
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --tag "${IMAGE}:${{ steps.version.outputs.version }}" \
            --tag "${IMAGE}:latest" \
            --push .

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
